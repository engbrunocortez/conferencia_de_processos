<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Conferência de Processos SVLMAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: barra superior fixa; início = lista de processos; processo = checklist por fase + coluna lateral de respostas, rota PG e prazos */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --fg:#18212D; --muted:#5B6676; --line:#D9DFE7;
  --accent:#1D4F91; --accent-fg:#FFFFFF; --accent-soft:#E3ECF8;
  --ok:#1B7A4C; --ok-soft:#E2F3EA; --warn:#A35E0B; --warn-soft:#FBEEDC; --bad:#B42318; --bad-soft:#FCE8E6; --na:#6B7280; --na-soft:#ECEEF1;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#171E27; --surface-2:#1E2732; --fg:#E6EBF1; --muted:#9AA6B5; --line:#2B3644;
  --accent:#7EA8E6; --accent-fg:#0E1620; --accent-soft:#1D2B3F;
  --ok:#5CC48F; --ok-soft:#16302A; --warn:#E8A54F; --warn-soft:#3A2A14; --bad:#F2867B; --bad-soft:#3B1D1B; --na:#9AA3AF; --na-soft:#232B35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#171E27; --surface-2:#1E2732; --fg:#E6EBF1; --muted:#9AA6B5; --line:#2B3644;
  --accent:#7EA8E6; --accent-fg:#0E1620; --accent-soft:#1D2B3F;
  --ok:#5CC48F; --ok-soft:#16302A; --warn:#E8A54F; --warn-soft:#3A2A14; --bad:#F2867B; --bad-soft:#3B1D1B; --na:#9AA3AF; --na-soft:#232B35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.mode{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.mode.db{background:var(--ok-soft);color:var(--ok)}
.mode.local{background:var(--warn-soft);color:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-inline:16px}

/* Início */
.home-head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.home-head h2{font-size:26px}
.home-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%}
.filters .inp{max-width:100%;min-width:0}
@media (max-width:600px){.filters{width:100%}.filters .inp{flex:1 1 100%}}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.prow:hover{border-color:var(--accent)}
.prow .l1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.prow .sei{font-family:var(--f-mono);font-size:14px;font-weight:500}
.prow .obj{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prow .l2{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.prow .right{display:flex;flex-direction:column;align-items:end;gap:6px;grid-row:span 2}
.meter{width:140px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)} .meter .m-na{background:var(--na)} .meter .m-pe{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.pe{background:var(--warn-soft);color:var(--warn)} .pill.an{background:var(--accent-soft);color:var(--accent)} .pill.na{background:var(--na-soft);color:var(--na)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 0 14px;max-width:70ch}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.modc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.modc:hover{border-color:var(--accent)}
.modc .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.modc b{font-family:var(--f-display);font-size:16px;font-weight:600}
.modc span{color:var(--muted);font-size:13px}
.modc em{font-style:normal;font-size:12px;color:var(--accent)}

/* Processo */
.back{margin-bottom:10px}
.phead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.phead .sei{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.phead h2{font-size:24px}
.phead .meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:13px}
.counts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bigmeter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bigmeter i{display:block;height:100%}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.top-in{padding-block:8px;gap:8px}.brand h1{font-size:17px}.brand small{display:none}.top .btn{padding:5px 9px;font-size:13px}.mode{font-size:11px}.phead h2{font-size:20px}}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.fase{margin-bottom:18px}
.fase h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:600;display:flex;gap:8px;align-items:center;margin:0 0 8px}
.fase h3 .fc{font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{border-top:1px solid var(--line);display:grid;grid-template-columns:3px 40px minmax(0,1fr);}
.step:first-child{border-top:0}
.step .bar{background:transparent}
.step.s-ok .bar{background:var(--ok)} .step.s-pend .bar{background:var(--warn)} .step.s-na .bar{background:var(--na)}
.step .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:13px 0 0 10px;font-variant-numeric:tabular-nums}
.step .body{padding:10px 12px 10px 0;min-width:0;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stitle{flex:1 1 280px;min-width:0}
.stitle .t{font-weight:500}
.step.s-na .stitle .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.stitle .sub{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px;align-items:center}
.chip{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ref{font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12.5px;cursor:pointer;border-left:1px solid var(--line);color:var(--muted);font-weight:500}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--fg)}
.seg button.on.ok{background:var(--ok-soft);color:var(--ok)}
.seg button.on.pend{background:var(--warn-soft);color:var(--warn)}
.seg button.on.na{background:var(--na-soft);color:var(--na)}
.seg button:disabled{cursor:not-allowed}
.more{font-size:12.5px}
.det{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.det ul{margin:0;padding-left:18px}
.det li{margin:2px 0}
.det .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.det .base{color:var(--muted)}
.det .fields{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:8px}
@media (max-width:560px){.det .fields{grid-template-columns:minmax(0,1fr)}}
.det label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.modelo{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;max-height:220px;overflow:auto}
.nota{font-size:13px;color:var(--fg);background:var(--warn-soft);border-radius:6px;padding:4px 8px}

/* Lateral */
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px;font-weight:600}
.q{display:flex;flex-direction:column;gap:4px}
.q > span{font-size:13px;font-weight:500}
.q small{color:var(--muted);font-size:12px}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.tog button{border:0;background:var(--surface);padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.tog button+button{border-left:1px solid var(--line)}
.tog button.on{background:var(--accent);color:var(--accent-fg)}
.rota{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rota.sem{background:var(--ok-soft)} .rota.com{background:var(--warn-soft)} .rota.na,.rota.q{background:var(--surface-2)}
.rota b{font-family:var(--f-display);font-size:17px}
.rota.sem b{color:var(--ok)} .rota.com b{color:var(--warn)}
.rota span{font-size:13px}
.alert{font-size:13px;border-radius:8px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.alert.alto{border-color:var(--bad);background:var(--bad-soft)}
.calc{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.calc label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc .out{font-size:13px;padding:6px 8px;border-radius:6px;background:var(--surface-2)}
.calc .out b{font-family:var(--f-mono);font-weight:500}
.fine{font-size:11.5px;color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,15,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow:auto}
.dlg{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:21px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.step,.prow{transition:background-color .15s}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><h1>Conferência de Processos</h1><small>SVLMAT · EEL/USP · Lei 14.133/2021</small></div>
  <span id="mode" class="mode">Carregando…</span>
  <button class="btn" data-act="exportar" type="button">Exportar backup</button>
  <button class="btn" data-act="importar" type="button">Importar backup</button>
  <input type="file" id="imp-file" accept="application/json,.json" hidden>
  <button class="btn" data-act="params" type="button">Parâmetros do ano</button>
  <button class="btn pri" data-act="novo" type="button">+ Novo processo</button>
</div></header>
<main id="app"><div class="loading">Carregando processos…</div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== Biblioteca de etapas — Conferência de Processos SVLMAT =====
   Fonte: roteiros SVLMAT v.2025, Lei 14.133/2021, Decreto SP 67.888/2023,
   Portaria PG 12/2024 (consolidada ago/2025) e relatórios de verificação PG/USP. */

const PARAM_DEFAULT = {
  ano: 2025,
  art6xxii: 250902323.87, // art. 6º, XXII (grande vulto) — 2025
  dlI: 125451.15,         // art. 75, I — 2025
  dlII: 62725.59,         // art. 75, II — 2025
  ufesp: 37.02,           // UFESP 2025
  pd300: 300000           // art. 70, III e art. 75, IV, "c" (valor nominal da lei)
};

const FASES = [
  { id: "P", n: "Planejamento da contratação" },
  { id: "I", n: "Preços, autorização e orçamento" },
  { id: "M", n: "Minutas e controle de legalidade" },
  { id: "D", n: "Divulgação" },
  { id: "S", n: "Sessão, julgamento e habilitação" },
  { id: "H", n: "Conferência e homologação" },
  { id: "E", n: "Empenho e formalização" },
  { id: "X", n: "Execução e pagamento" },
  { id: "F", n: "Encerramento" }
];

const brl = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

/* Perguntas que filtram o roteiro */
const PERGUNTAS = {
  objeto:      { label: "Objeto", tipo: "sel", ops: [["bens", "Bens"], ["servicos", "Serviços"]], def: "bens" },
  inciso:      { label: "Hipótese de dispensa por valor", tipo: "sel", ops: [["II", "Art. 75, II — compras e outros serviços"], ["I", "Art. 75, I — obras, engenharia, manutenção de veículos"]], def: "II" },
  natureza:    { label: "Natureza da obra/serviço", tipo: "sel", ops: [["comum", "Obra ou serviço comum de engenharia"], ["especial", "Obra ou serviço especial de engenharia"]], def: "comum" },
  regime:      { label: "Regime de execução", tipo: "sel", ops: [["unitario", "Empreitada por preço unitário"], ["global", "Empreitada por preço global"], ["integral", "Empreitada integral"], ["tarefa", "Contratação por tarefa"], ["integrada", "Contratação integrada"], ["semi", "Contratação semi-integrada"], ["fornec", "Fornecimento e prestação de serviço associado"]], def: "global" },
  categoria:   { label: "Categoria (Portaria GR 3.925/2008)", tipo: "sel", ops: [["A", "A"], ["B", "B"], ["C", "C"], ["D", "D"]], def: "D" },
  contrato:    { label: "Haverá termo de contrato?", ajuda: "Se não, a notificação de fornecimento/nota de empenho substitui o contrato (art. 95).", tipo: "bool", def: false },
  permanente:  { label: "Material permanente (incorporação patrimonial)?", tipo: "bool", def: false },
  minutaPadrao:{ label: "Minutas padrão usadas sem alteração além dos campos editáveis?", ajuda: "Inclui o contrato: contrato não padronizado obriga envio à PG (Portaria PG 12/2024, art. 6º).", tipo: "bool", def: true },
  duvida:      { label: "Há dúvida jurídica sobre a hipótese de contratação?", ajuda: "Dúvida apenas técnica não justifica envio à PG (art. 7º).", tipo: "bool", def: false },
  irp:         { label: "Haverá IRP com órgãos participantes?", ajuda: "Dispensável quando a EEL for a única contratante (art. 86, §1º).", tipo: "bool", def: false },
  contrataJa:  { label: "Primeira contratação no mesmo processo da ata?", tipo: "bool", def: true },
  lei8010:     { label: "Importação para projeto de pesquisa (Lei 8.010/1990)?", tipo: "bool", def: true },
  esclarec:    { label: "Houve pedido de esclarecimento?", tipo: "bool", def: false },
  impug:       { label: "Houve pedido de impugnação?", tipo: "bool", def: false },
  recurso:     { label: "Houve intenção de recurso?", tipo: "bool", def: false }
};

/* ---------- Etapas ----------
   f: fase · t: título · r: responsável · b: base legal/normativa
   v: o que verificar (array ou função(c,m,p)) · w: condição (função(c,m)) · mod: texto-modelo */
const ETAPAS = {
  // Planejamento
  p_sei:   { f: "P", t: "Abertura do processo no SEI — ficha de identificação", r: "Planejamento", b: "Decreto SP 67.641/2023",
             v: ["Unidade interessada", "Identificação do objeto", "Departamento solicitante", "Identificação do solicitante"] },
  p_dfd:   { f: "P", t: "Documento de formalização de demanda (DFD — PGC) ou justificativa de não previsão no PCA", r: "Planejamento", b: "Lei 14.133, art. 12, VII; art. 72, I" },
  p_notif: { f: "P", t: "Notificação de início da fase preparatória à Equipe de Planejamento da Contratação", r: "Planejamento", v: ["Exigida a partir das contratações do PCA 2026"] },
  p_dem:   { f: "P", t: "Documento de Demanda (Sistema Administrativo USP)", r: "Planejamento" },
  p_etp:   { f: "P", t: "Estudo Técnico Preliminar (ETP) assinado", r: "Planejamento", b: "Lei 14.133, art. 18, I e §§ 1º a 3º",
             v: ["Descrição da necessidade", "Estimativa de quantidades", "Estimativa do valor", "Manifestação sobre parcelamento", "Conclusão sobre a adequação da contratação", "Justificativa para itens não obrigatórios omitidos"] },
  p_arp:   { f: "P", t: "Análise de Risco Preliminar (ARP)", r: "Planejamento", b: "Lei 14.133, art. 18, X" },
  p_tr:    { f: "P", t: "Termo de Referência preliminar no padrão PG/USP, sem valor referencial", r: "Planejamento", b: "Lei 14.133, art. 18, II; Decreto SP 68.185/2023",
             v: ["Minuta na versão mais recente publicada pelo DA/PG", "Sem valor referencial ou informação orçamentária"] },

/* Rota na Procuradoria Geral — Portaria PG 12/2024 (consolidada ago/2025) */
function rotaPG(m, c, p) {
  if (m.tipo === "outro") return { rota: "na", motivo: "Fluxo sem análise jurídica prévia prevista nos roteiros." };
  if (!c.minutaPadrao) return { rota: "com", motivo: "Minuta alterada ou contrato não padronizado: envio obrigatório à PG (art. 6º)." };
  if (m.tipo === "lic") return { rota: "sem", motivo: "Edital com minuta padrão pré-aprovada: dispensa de trâmite (art. 1º)." };
  if (c.duvida) return { rota: "com", motivo: "Dúvida jurídica sobre a contratação: remeter à PG (art. 3º, exceção; art. 7º)." };
  const v = Number(c.valor) || 0;
  if (["dlcom", "dlsem", "dlconc"].includes(m.id)) return { rota: "sem", motivo: "Dispensa por valor com aviso padrão: dispensa de trâmite (art. 3º)." };
  if (m.id === "pd") {
    const lim = p.art6xxii * 0.005;
    return v && v > lim ? { rota: "com", motivo: `Valor acima de ${brl(lim)} (0,5% do art. 6º, XXII): envio à PG (art. 3º, §1º-A).` }
                        : { rota: "sem", motivo: `Produto para pesquisa até ${brl(lim)}: dispensa de trâmite (art. 3º, §1º-A).` };
  }
  const lim = 2 * p.dlII;
  if (!v) return { rota: "?", motivo: `Informe o valor estimado: até ${brl(lim)} (2× o limite do art. 75) a inexigibilidade dispensa trâmite na PG (art. 3º, §1º).` };
  return v > lim ? { rota: "com", motivo: `Inexigibilidade acima de ${brl(lim)} (2× o limite do art. 75): envio à PG (art. 3º, §1º).` }
                 : { rota: "sem", motivo: `Inexigibilidade até ${brl(lim)}: dispensa de trâmite (art. 3º, §1º).` };
}

/* Prazo mínimo do edital — Lei 14.133, art. 55 */
function prazoEdital(m, c) {
  if (["dlcom", "dlconc"].includes(m.id)) return { dias: 3, txt: "3 dias úteis (art. 75, §3º)" };
  if (m.id === "conc") {
    if (c.regime === "integrada") return { dias: 60, txt: "60 dias úteis — contratação integrada (art. 55, II, c)" };
    if (c.regime === "semi") return { dias: 35, txt: "35 dias úteis — contratação semi-integrada (art. 55, II, d)" };
    if (c.natureza === "especial") return { dias: 25, txt: "25 dias úteis — obra/serviço especial de engenharia (art. 55, II, b)" };
    return { dias: 10, txt: "10 dias úteis — obra/serviço comum de engenharia (art. 55, II, a)" };
  }
  if (m.id === "pregao" || m.id === "srp") return c.objeto === "servicos" ? { dias: 10, txt: "10 dias úteis — serviços comuns (art. 55, II, a)" } : { dias: 8, txt: "8 dias úteis — bens, menor preço (art. 55, I, a)" };
  return null;
}

/* Contexto efetivo (respostas + padrões + valores fixos da modalidade) */
function contexto(m, ctx) {
  const c = {};
  for (const k of Object.keys(PERGUNTAS)) c[k] = PERGUNTAS[k].def;
  c.valor = 0;
  Object.assign(c, ctx || {}, m.fixo || {});
  return c;
}

/* Roteiro filtrado */
function roteiro(m, c, p) {
  const out = [];
  const pg = rotaPG(m, c, p);
  for (let id of m.seq) {
    if (id === "$PG") {
      if (pg.rota === "com") out.push("m_rcom", "m_djur", "m_mjur");
      else if (pg.rota !== "na") out.push("m_rsem");
      continue;
    }
    if (id.startsWith("$JA:")) { if (!c.contrataJa) continue; id = id.slice(4); }
    const e = ETAPAS[id];
    if (!e) throw new Error("Etapa inexistente: " + id);
    if (e.w && !e.w(c, m)) continue;
    out.push(id);
  }
  return out;
}

/* Alertas automáticos */
function alertas(m, c, p) {
  const a = [];
  const v = Number(c.valor) || 0;
  if (v && m.tipo !== "outro" && v > p.art6xxii * 0.01) a.push({ n: "alto", t: `Valor acima de ${brl(p.art6xxii * 0.01)}: autorização e homologação cabem ao Reitor (Portaria GR 8.321/2024).` });
  if (["dlcom", "dlsem", "dlconc"].includes(m.id)) {
    const lim = c.inciso === "I" ? p.dlI : p.dlII;
    if (v && v >= lim) a.push({ n: "alto", t: `Valor igual ou acima do limite do art. 75, ${c.inciso} (${brl(lim)}): não cabe dispensa por valor.` });
    a.push({ n: "info", t: "Confira o somatório do exercício para objetos do mesmo ramo (art. 75, §1º) antes de seguir." });
  }
  if (m.id === "pd" && c.objeto === "servicos") a.push({ n: "info", t: "Obras e serviços de engenharia para P&D: limite do art. 75, IV, \"c\" e regulamento específico (§5º)." });
  if (m.id === "conc" && c.categoria !== "D") a.push({ n: "info", t: `Categoria ${c.categoria}: exige Termo de Compromisso da SEF antes da licitação.` });
  if (m.id === "srp" && !c.contrataJa) a.push({ n: "info", t: "Sem contratação neste processo: os consumos seguem pelo roteiro \"Consumo de ata\"." });
  if (m.id === "imp") a.push({ n: "info", t: "Hipótese legal é inexigibilidade (art. 74); a planilha v.2025 citava o art. 75 por engano." });
  return a;
}

/* Dias úteis (sem feriados) */
function somaDiasUteis(data, n) {
  const d = new Date(data.getTime());
  let k = 0;
  while (k < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) k++; }
  return d;
}

if (typeof module !== "undefined") module.exports = { PARAM_DEFAULT, FASES, PERGUNTAS, ETAPAS, MODALIDADES, MOD, rotaPG, prazoEdital, contexto, roteiro, alertas, somaDiasUteis, brl };

</script>
<script>
(() => {
"use strict";
const LS_KEY = "svlmat-conferencia-v1";
const S = {
  mode: "loading", db: null, user: null, uid: null, canWrite: true,
  procs: new Map(), params: { ...PARAM_DEFAULT }, paramsSalvos: false,
  view: "home", cur: null, busca: "", fmod: "", filtro: "todas", open: new Set(),
  names: {}, dirty: false, modal: null, confirmDel: false
};
const app = document.getElementById("app");
const $modal = document.getElementById("modal");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtData = ts => ts ? new Date(ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const fmtDia = d => d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
const parseISO = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Armazenamento ---------- */
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); S.procs = new Map(Object.entries(o.procs || {})); if (o.params) { S.params = { ...PARAM_DEFAULT, ...o.params }; S.paramsSalvos = true; } } } catch (e) {}
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ procs: Object.fromEntries(S.procs), params: S.paramsSalvos ? S.params : null })); } catch (e) {}
}
function deepMerge(t, s) {
  for (const k of Object.keys(s)) {
    const v = s[k];
    if (v && typeof v === "object" && !Array.isArray(v)) { t[k] = deepMerge(t[k] && typeof t[k] === "object" ? { ...t[k] } : {}, v); }
    else t[k] = v;
  }
  return t;
}
const queues = new Map();
function enqueue(key, fn) {
  const prev = queues.get(key) || Promise.resolve();
  const next = prev.then(fn).catch(onWriteError);
  queues.set(key, next);
  return next;
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === "invalid_argument" || code === "not_granted" || code === "revoked") { S.canWrite = false; toast("Você pode consultar, mas não tem permissão para alterar este sistema."); scheduleRender(); }
  else if (code === "quota_exceeded") toast("Limite de armazenamento atingido. Exclua processos encerrados para liberar espaço.");
  else toast("Não foi possível salvar agora. Tente de novo em instantes.");
}
function stamp(o) { o.atualizadoEm = Date.now(); if (S.uid) o.atualizadoPor = S.uid; return o; }
function updateProc(id, patch) {
  if (!S.canWrite) return;
  stamp(patch);
  if (S.mode === "db") {
    // reflexo imediato; o snapshot confirma
    const p = S.procs.get(id); if (p) S.procs.set(id, deepMerge({ ...p }, patch));
    return enqueue(id, () => S.db.doc("processos/" + id).update(patch));
  }
  const p = S.procs.get(id); if (!p) return;
  S.procs.set(id, deepMerge({ ...p }, patch)); saveLocal(); scheduleRender();
}
async function createProc(body) {
  const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  stamp(body); body.criadoEm = body.atualizadoEm; if (S.uid) body.criadoPor = S.uid;
  if (S.mode === "db") { S.procs.set(id, { id, ...body }); await enqueue(id, () => S.db.doc("processos/" + id).set(body)); }
  else { S.procs.set(id, { id, ...body }); saveLocal(); }
  return id;
}
function deleteProc(id) {
  S.procs.delete(id);
  if (S.mode === "db") enqueue(id, () => S.db.doc("processos/" + id).delete());
  else saveLocal();
}
function saveParams(p) {
  S.params = { ...PARAM_DEFAULT, ...p }; S.paramsSalvos = true;
  if (S.mode === "db") enqueue("config", () => S.db.doc("config/parametros").set(stamp({ ...p })));
  else saveLocal();
}

/* ---------- Inicialização ---------- */
async function boot() {
  route();
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }
  } catch (e) {}
  S.user = user;
  if (user) {
    try { S.uid = await user.id(); } catch (e) {}
    try { const cw = await user.can("data.write"); if (cw === false) S.canWrite = false; } catch (e) {}
  }
  if (db) {
    S.db = db; S.mode = "db"; S.loaded = false;
    db.collection("processos").onSnapshot(snap => {
      S.procs = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
      S.loaded = true; scheduleRender();
    }, err => { toast("A conexão com os dados foi interrompida. Recarregue a página."); });
    db.doc("config/parametros").onSnapshot(s => {
      if (s.exists) { S.params = { ...PARAM_DEFAULT, ...s.data() }; S.paramsSalvos = true; }
      scheduleRender();
    }, () => {});
  } else {
    S.mode = "local"; S.loaded = true; loadLocal();
  }
  scheduleRender();
}

/* ---------- Render ---------- */
let rq = false;
function isEditing() { const a = document.activeElement; return a && app.contains(a) && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "date")); }
function scheduleRender() { if (isEditing()) { S.dirty = true; return; } if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
document.addEventListener("focusout", () => { if (S.dirty) { S.dirty = false; setTimeout(scheduleRender, 0); } });

function route() {
  const h = (location.hash || "").slice(1);
  if (h.startsWith("p-")) { S.view = "proc"; S.cur = h.slice(2); }
  else { S.view = "home"; S.cur = null; }
  S.confirmDel = false;
}
window.addEventListener("hashchange", () => { route(); render(); window.scrollTo(0, 0); });

function modeBadge() {
  const m = document.getElementById("mode");
  if (S.mode === "db") { m.className = "mode db"; m.textContent = S.canWrite ? "Compartilhado com a equipe" : "Somente leitura"; }
  else if (S.mode === "local") { m.className = "mode local"; m.textContent = "Dados salvos neste navegador"; }
  else { m.className = "mode"; m.textContent = "Carregando…"; }
  document.querySelectorAll('[data-act="novo"],[data-act="params"]').forEach(b => b.disabled = !S.canWrite && b.dataset.act === "novo");
}

function analise(p) {
  const m = MOD[p.modalidade]; if (!m) return null;
  const c = contexto(m, p.ctx);
  const ids = roteiro(m, c, S.params);
  const ch = p.checks || {};
  let ok = 0, pend = 0, na = 0;
  for (const id of ids) { const s = ch[id]?.s; if (s === "ok") ok++; else if (s === "pend") pend++; else if (s === "na") na++; }
  const tot = ids.length, aconf = tot - ok - pend - na;
  const st = pend ? "pe" : aconf ? "an" : "ok";
  const stTxt = pend ? `${pend} pendência${pend > 1 ? "s" : ""}` : aconf ? "Em conferência" : "Conferido";
  return { m, c, ids, ok, pend, na, tot, aconf, st, stTxt };
}
function meter(a, cls = "meter") {
  const w = n => (a.tot ? (n / a.tot * 100) : 0).toFixed(2) + "%";
  return `<div class="${cls}" role="img" aria-label="${a.ok} conforme, ${a.pend} pendentes, ${a.na} não se aplica, de ${a.tot}"><i class="m-ok" style="width:${w(a.ok)}"></i><i class="m-na" style="width:${w(a.na)}"></i><i class="m-pe" style="width:${w(a.pend)}"></i></div>`;
}

function render() {
  modeBadge();
  if (!S.loaded) { app.innerHTML = `<div class="loading">Carregando processos…</div>`; return; }
  if (S.view === "proc") { const p = S.procs.get(S.cur); if (p) { renderProc(p); resolveNames(p); return; } }
  renderHome();
}

function modCards() {
  return `<div class="mods">${MODALIDADES.map(m => {
    const n = roteiro(m, contexto(m, {}), S.params).length;
    return `<button class="modc" type="button" data-act="novo" data-mod="${m.id}"><span class="g">${esc(m.grupo)}</span><b>${esc(m.nome)}</b><span>${esc(m.desc)}</span><em>${n} etapas no roteiro básico</em></button>`;
  }).join("")}</div>`;
}

function renderHome() {
  const all = [...S.procs.values()].sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
  const q = S.busca.trim().toLowerCase();
  const list = all.filter(p => (!S.fmod || p.modalidade === S.fmod) && (!q || [p.sei, p.objeto, p.demanda].some(x => String(x || "").toLowerCase().includes(q))));
  let h = `<div class="home-head"><div><h2>Processos em conferência</h2><p>Escolha um processo para conferir a instrução documento a documento, ou abra um novo a partir do roteiro da modalidade.</p></div>`;
  if (all.length) h += `<div class="filters"><input id="busca" class="inp" type="search" placeholder="Buscar nº SEI, objeto ou demanda" value="${esc(S.busca)}" aria-label="Buscar processos">
     <select id="fmod" class="inp" aria-label="Filtrar por modalidade"><option value="">Todas as modalidades</option>${MODALIDADES.map(m => `<option value="${m.id}" ${S.fmod === m.id ? "selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></div>`;
  h += `</div>`;
  if (!all.length) {
    h += `<div class="empty"><h3>Nenhum processo cadastrado ainda</h3><p>Cada processo recebe o checklist da sua modalidade, filtrado pelas respostas (contrato, material permanente, impugnação, recurso…), com a base legal de cada documento, a rota na PG pela Portaria PG 12/2024 e a calculadora de prazos. Comece escolhendo o roteiro:</p>${modCards()}</div>`;
  } else if (!list.length) {
    h += `<div class="empty"><p>Nenhum processo corresponde à busca.</p></div>`;
  } else {
    h += `<div class="plist">${list.map(p => {
      const a = analise(p); if (!a) return "";
      return `<button class="prow" type="button" data-act="abrir" data-id="${esc(p.id)}">
        <div class="l1"><span class="sei">${esc(p.sei || "Sem nº SEI")}</span><span class="obj">${esc(p.objeto || "")}</span></div>
        <div class="right"><span class="pill ${a.st}">${a.stTxt}</span>${meter(a)}</div>
        <div class="l2"><span>${esc(a.m.nome)}</span>${p.demanda ? `<span>Demanda <span class="mono">${esc(p.demanda)}</span></span>` : ""}<span>${a.ok + a.na}/${a.tot} conferidos</span><span>Atualizado ${fmtData(p.atualizadoEm)}</span></div>
      </button>`;
    }).join("")}</div>`;
    h += `<details style="margin-top:22px"><summary class="btn ghost" style="display:inline-flex">Ver os roteiros disponíveis</summary><div style="margin-top:10px">${modCards()}</div></details>`;
  }
  app.innerHTML = h;
}

function quest(k, c, dis) {
  const q = PERGUNTAS[k];
  if (k === "valor") return `<label class="q"><span>Valor estimado</span><input id="q-valor" class="inp mono" inputmode="decimal" placeholder="0,00" value="${c.valor ? Number(c.valor).toLocaleString("pt-BR", { minimumFractionDigits: 2 }) : ""}" ${dis}><small>Usado nos alertas de alçada, rota PG e habilitação.</small></label>`;
  if (q.tipo === "bool") return `<div class="q"><span>${esc(q.label)}</span><div class="tog" role="group" aria-label="${esc(q.label)}"><button type="button" class="${c[k] ? "on" : ""}" data-act="q" data-k="${k}" data-v="1" ${dis} aria-pressed="${!!c[k]}">Sim</button><button type="button" class="${!c[k] ? "on" : ""}" data-act="q" data-k="${k}" data-v="0" ${dis} aria-pressed="${!c[k]}">Não</button></div>${q.ajuda ? `<small>${esc(q.ajuda)}</small>` : ""}</div>`;
  return `<label class="q"><span>${esc(q.label)}</span><select id="q-${k}" class="inp" data-q="${k}" ${dis}>${q.ops.map(([v, l]) => `<option value="${v}" ${c[k] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
}

function renderProc(p) {
  const a = analise(p); const { m, c } = a;
  const dis = S.canWrite ? "" : "disabled";
  const pg = rotaPG(m, c, S.params);
  const al = alertas(m, c, S.params);
  const ch = p.checks || {};
  const idx = new Map(a.ids.map((id, i) => [id, i + 1]));
  const vis = a.ids.filter(id => { const s = ch[id]?.s; return S.filtro === "todas" || (S.filtro === "abertas" && !s) || (S.filtro === "pend" && s === "pend"); });

  let h = `<div class="back"><a class="btn ghost" href="#">← Todos os processos</a></div>
  <section class="phead">
    <div class="sei">${p.sei ? "Processo SEI " + esc(p.sei) : "Processo sem nº SEI"}</div>
    <h2>${esc(p.objeto || "Objeto não informado")}</h2>
    <div class="meta"><span>${esc(m.nome)}</span><span class="pill ${pg.rota === "sem" ? "ok" : pg.rota === "com" ? "pe" : "na"}">${{ sem: "Sem trâmite na PG", com: "Vai à PG", na: "Sem análise da PG", "?": "Rota PG: informe o valor" }[pg.rota]}</span>${al.some(x => x.n === "alto") ? `<span class="pill bad">${al.filter(x => x.n === "alto").length} alerta${al.filter(x => x.n === "alto").length > 1 ? "s" : ""}</span>` : ""}${p.demanda ? `<span>Demanda <span class="mono">${esc(p.demanda)}</span></span>` : ""}<span>Criado ${fmtData(p.criadoEm)}</span><span>Atualizado ${fmtData(p.atualizadoEm)}${p.atualizadoPor && S.names[p.atualizadoPor] ? " por " + esc(S.names[p.atualizadoPor]) : ""}</span>
      ${S.canWrite ? `<button class="btn ghost more" type="button" data-act="editar">Editar dados</button>` : ""}</div>
    ${meter(a, "bigmeter")}
    <div class="counts"><span class="pill ok">${a.ok} conforme</span><span class="pill pe">${a.pend} pendente${a.pend === 1 ? "" : "s"}</span><span class="pill na">${a.na} não se aplica</span><span class="pill an">${a.aconf} a conferir</span><span class="fine">de ${a.tot} etapas</span></div>
  </section>
  <div class="grid"><div>
    <div class="tabs" role="group" aria-label="Filtrar etapas">
      ${[["todas", "Todas"], ["abertas", "A conferir"], ["pend", "Pendências"]].map(([k, l]) => `<button type="button" class="tab" data-act="filtro" data-f="${k}" aria-pressed="${S.filtro === k}">${l}</button>`).join("")}
      <button type="button" class="tab" data-act="expandir">${S.open.size ? "Recolher detalhes" : "Expandir detalhes"}</button>
    </div>`;

  if (!vis.length) h += `<div class="empty"><p>${S.filtro === "pend" ? "Nenhuma pendência registrada." : "Todas as etapas já foram conferidas."}</p></div>`;
  for (const f of FASES) {
    const fs = vis.filter(id => ETAPAS[id].f === f.id); if (!fs.length) continue;
    h += `<section class="fase"><h3><span class="fc">${f.id}</span>${esc(f.n)}</h3><div class="steps">`;
    for (const id of fs) {
      const e = ETAPAS[id], k = ch[id] || {}, s = k.s || "";
      const v = typeof e.v === "function" ? e.v(c, m, S.params) : (e.v || []);
      const op = S.open.has(id);
      h += `<div class="step ${s ? "s-" + s : ""}" id="st-${id}"><div class="bar"></div><div class="num">${String(idx.get(id)).padStart(2, "0")}</div><div class="body">
        <div class="srow"><div class="stitle"><div class="t">${esc(e.t)}</div><div class="sub"><span class="chip">${esc(e.r || "")}</span>${k.ref ? `<span class="chip ref">${esc(k.ref)}</span>` : ""}${e.b ? `<span>${esc(e.b)}</span>` : ""}
          <button type="button" class="btn ghost more" data-act="det" data-id="${id}" aria-expanded="${op}">${op ? "Ocultar" : (v.length || e.mod ? "O que verificar" : "Anotar")}</button></div></div>
          <div class="seg" role="group" aria-label="Situação">
            <button type="button" class="${s === "ok" ? "on ok" : ""}" data-act="st" data-id="${id}" data-s="ok" ${dis} aria-pressed="${s === "ok"}">Conforme</button>
            <button type="button" class="${s === "pend" ? "on pend" : ""}" data-act="st" data-id="${id}" data-s="pend" ${dis} aria-pressed="${s === "pend"}">Pendência</button>
            <button type="button" class="${s === "na" ? "on na" : ""}" data-act="st" data-id="${id}" data-s="na" ${dis} aria-pressed="${s === "na"}">N/A</button>
          </div></div>
        ${k.nota && !op ? `<div class="nota">${esc(k.nota)}</div>` : ""}
        ${op ? `<div class="det">
          ${v.length ? `<div><div class="lab">Verificar</div><ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
          ${e.mod ? `<div><div class="lab">Texto-modelo</div><div class="modelo" id="mod-${id}">${esc(e.mod)}</div><button type="button" class="btn more" style="margin-top:6px" data-act="copiar" data-id="${id}">Copiar texto</button></div>` : ""}
          <div class="fields"><label>Documento SEI nº<input class="inp mono" id="ref-${id}" data-f="ref" data-id="${id}" value="${esc(k.ref || "")}" placeholder="ex.: 0123456" ${dis}></label>
          <label>Observação<input class="inp" id="nota-${id}" data-f="nota" data-id="${id}" value="${esc(k.nota || "")}" placeholder="O que falta, quem vai providenciar…" ${dis}></label></div>
          ${k.em ? `<div class="fine">Marcado em ${fmtData(k.em)}${k.por && S.names[k.por] ? " por " + esc(S.names[k.por]) : ""}</div>` : ""}
        </div>` : ""}
      </div></div>`;
    }
    h += `</div></section>`;
  }
  h += `</div><aside class="side">`;

  // Rota PG
  const rotaTit = { sem: "Sem trâmite na PG", com: "Com encaminhamento à PG", na: "Sem análise da PG", "?": "Rota na PG a definir" }[pg.rota];
  h += `<div class="card"><h3>Procuradoria Geral</h3><div class="rota ${pg.rota === "?" ? "q" : pg.rota}"><b>${rotaTit}</b><span>${esc(pg.motivo)}</span></div>
    ${pg.rota === "sem" ? `<div class="fine">Use o relatório de verificação "sem PG" da modalidade, na versão vigente no site da PG.</div>` : ""}
    ${al.map(x => `<div class="alert ${x.n}">${esc(x.t)}</div>`).join("")}</div>`;

  // Perguntas
  if (m.perg.length) h += `<div class="card"><h3>Características do processo</h3><div class="fine">As respostas ajustam o roteiro: etapas entram ou saem automaticamente.</div>${m.perg.map(k => quest(k, c, dis)).join("")}</div>`;

  // Prazos
  const pz = prazoEdital(m, c);
  const dt = p.datas || {};
  const div = parseISO(dt.divulg), ass = parseISO(dt.assin), orc = parseISO(dt.orcam);
  let calc = `<div class="calc">`;
  if (pz) calc += `<label>Divulgação do edital/aviso<input type="date" class="inp" id="dt-divulg" data-dt="divulg" value="${esc(dt.divulg || "")}" ${dis}></label>
     <div class="out">Prazo mínimo: ${esc(pz.txt)}${div ? `<br>Propostas/sessão a partir de <b>${fmtDia(somaDiasUteis(div, pz.dias))}</b>` : ""}</div>
     <label>Data do orçamento mais antigo<input type="date" class="inp" id="dt-orcam" data-dt="orcam" value="${esc(dt.orcam || "")}" ${dis}></label>`;
  if (pz && orc && div) {
    const lim = new Date(div); lim.setMonth(lim.getMonth() - 6);
    calc += `<div class="out">${orc >= lim ? "Orçamento dentro dos 6 meses anteriores à divulgação." : `<span style="color:var(--bad)">Orçamento com mais de 6 meses da divulgação (limite: ${fmtDia(lim)}). Atualize a pesquisa.</span>`}</div>`;
  }
  if (m.tipo !== "outro" || m.id === "consumo") {
    const dias = m.tipo === "lic" || m.id === "consumo" ? 20 : 10;
    calc += `<label>Assinatura do contrato/instrumento<input type="date" class="inp" id="dt-assin" data-dt="assin" value="${esc(dt.assin || "")}" ${dis}></label>
     <div class="out">Publicação no PNCP em até ${dias} dias úteis (art. 94)${ass ? `: até <b>${fmtDia(somaDiasUteis(ass, dias))}</b>` : ""}${m.id === "conc" && ass ? `<br>Quantitativos e preços unitários: até <b>${fmtDia(somaDiasUteis(ass, 25))}</b>` : ""}</div>`;
  }
  calc += `<div class="fine">Contagem em dias úteis de segunda a sexta; feriados e pontos facultativos não são descontados.</div></div>`;
  if (m.id !== "passagem") h += `<div class="card"><h3>Prazos</h3>${calc}</div>`;

  // Ações
  h += `<div class="card"><h3>Relatório e ações</h3>
    <button class="btn" type="button" data-act="relatorio">Baixar relatório de conferência</button>
    <button class="btn" type="button" data-act="copiarrel">Copiar pendências</button>
    ${S.canWrite ? (S.confirmDel ? `<div class="alert alto">Excluir este processo e toda a conferência? Isso não pode ser desfeito.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" type="button" data-act="excluir-sim">Excluir definitivamente</button><button class="btn" type="button" data-act="excluir-nao">Cancelar</button></div>` : `<button class="btn danger" type="button" data-act="excluir">Excluir processo</button>`) : ""}
    </div>`;
  h += `<div class="fine" style="padding:0 4px">Parâmetros de ${esc(S.params.ano)}${S.paramsSalvos ? "" : " (valores padrão — confira em Parâmetros do ano)"}.</div>`;
  h += `</aside></div>`;
  app.innerHTML = h;
}

async function resolveNames(p) {
  if (!S.user || typeof S.user.profiles !== "function") return;
  const ids = new Set([p.atualizadoPor, p.criadoPor, ...Object.values(p.checks || {}).map(k => k.por)].filter(x => x && !(x in S.names)));
  if (!ids.size) return;
  try {
    const ps = await S.user.profiles([...ids]);
    let changed = false;
    for (const id of ids) { S.names[id] = (ps && ps[id] && ps[id].name) || ""; changed = true; }
    if (changed) scheduleRender();
  } catch (e) { for (const id of ids) S.names[id] = ""; }
}

/* ---------- Relatório ---------- */
function relatorio(p, soPend) {
  const a = analise(p); const { m, c } = a; const ch = p.checks || {};
  const pg = rotaPG(m, c, S.params);
  const lab = { ok: "CONFORME", pend: "PENDÊNCIA", na: "N/A", "": "A CONFERIR" };
  let t = `RELATÓRIO DE CONFERÊNCIA DE INSTRUÇÃO PROCESSUAL\n\nProcesso SEI: ${p.sei || "—"}\nObjeto: ${p.objeto || "—"}\nModalidade: ${m.nome}\n${p.demanda ? "Demanda: " + p.demanda + "\n" : ""}Rota na PG: ${pg.motivo}\nGerado em: ${new Date().toLocaleString("pt-BR")}\n\nResumo: ${a.ok} conforme · ${a.pend} pendências · ${a.na} não se aplica · ${a.aconf} a conferir (de ${a.tot})\n`;
  if (soPend) {
    const pend = a.ids.filter(id => ch[id]?.s === "pend");
    t = `Pendências — Processo SEI ${p.sei || "—"} (${m.nome})\n\n` + (pend.length ? pend.map(id => `• ${ETAPAS[id].t}${ch[id].nota ? " — " + ch[id].nota : ""}`).join("\n") : "Nenhuma pendência registrada.");
    return t;
  }
  for (const f of FASES) {
    const ids = a.ids.filter(id => ETAPAS[id].f === f.id); if (!ids.length) continue;
    t += `\n${f.n.toUpperCase()}\n`;
    for (const id of ids) {
      const k = ch[id] || {};
      t += `${String(a.ids.indexOf(id) + 1).padStart(2, "0")}. [${lab[k.s || ""]}] ${ETAPAS[id].t}${k.ref ? " (doc. SEI " + k.ref + ")" : ""}${k.nota ? "\n    Obs.: " + k.nota : ""}\n`;
    }
  }
  return t;
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Copiado."); return true; } catch (e) { toast("Não foi possível copiar automaticamente."); return false; }
}

function baixarArquivo(nome, txt, tipo) {
  const blob = new Blob([txt], { type: tipo || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const el = document.createElement("a"); el.href = url; el.download = nome; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* ---------- Modais ---------- */
function openModal(html) { $modal.innerHTML = `<div class="ov" data-act="fechar-ov"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`; const f = $modal.querySelector("input,select"); if (f) f.focus(); }
function closeModal() { $modal.innerHTML = ""; }

function modalNovo(modId, p) {
  const ed = !!p;
  openModal(`<h2>${ed ? "Editar dados do processo" : "Novo processo"}</h2>
   <form id="f-novo">
    <div style="display:flex;flex-direction:column;gap:10px">
    <label>Nº do processo SEI<input id="n-sei" class="inp mono" placeholder="154.00000000/2026-00" value="${esc(p?.sei || "")}"></label>
    <label>Objeto<input id="n-obj" class="inp" placeholder="Ex.: Aquisição de reagentes para o DEBIQ" value="${esc(p?.objeto || "")}" required></label>
    <div class="two"><label>Nº da demanda<input id="n-dem" class="inp mono" value="${esc(p?.demanda || "")}"></label>
    <label>Modalidade / roteiro<select id="n-mod" class="inp" ${ed ? "disabled" : ""}>${["Licitação", "Contratação direta", "Outros"].map(g => `<optgroup label="${g}">${MODALIDADES.filter(m => m.grupo === g).map(m => `<option value="${m.id}" ${(p?.modalidade || modId) === m.id ? "selected" : ""}>${esc(m.nome)}</option>`).join("")}</optgroup>`).join("")}</select></label></div>
    <div class="err" id="n-err" hidden></div>
    <div class="row"><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn pri">${ed ? "Salvar" : "Criar e abrir checklist"}</button></div>
    </div></form>`);
  document.getElementById("f-novo").addEventListener("submit", async ev => {
    ev.preventDefault();
    const sei = document.getElementById("n-sei").value.trim(), objeto = document.getElementById("n-obj").value.trim(), demanda = document.getElementById("n-dem").value.trim(), modalidade = document.getElementById("n-mod").value;
    if (!objeto) { const e = document.getElementById("n-err"); e.textContent = "Informe o objeto do processo."; e.hidden = false; return; }
    if (ed) { updateProc(p.id, { sei, objeto, demanda }); closeModal(); scheduleRender(); return; }
    const id = await createProc({ sei, objeto, demanda, modalidade, ctx: {}, checks: {}, datas: {} });
    closeModal(); location.hash = "p-" + id;
  });
}

function modalParams() {
  const p = S.params, dis = S.canWrite ? "" : "disabled";
  const f = (k, l, help) => `<label>${l}<input id="pm-${k}" class="inp mono" inputmode="decimal" value="${Number(p[k]).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}" ${dis}>${help ? `<span class="fine">${help}</span>` : ""}</label>`;
  openModal(`<h2>Parâmetros do ano</h2>
   <p class="fine" style="margin:0">Os valores da Lei 14.133 são atualizados todo 1º de janeiro pelo IPCA-E e divulgados no PNCP (art. 182). Os padrões abaixo são de 2025; confira o decreto do exercício antes de usar.${S.mode === "db" ? " A alteração vale para toda a equipe." : ""}</p>
   <form id="f-par"><div style="display:flex;flex-direction:column;gap:10px">
    <label>Exercício<input id="pm-ano" class="inp mono" inputmode="numeric" value="${esc(p.ano)}" ${dis}></label>
    <div class="two">${f("dlI", "Limite art. 75, I (R$)", "Obras, engenharia, manutenção de veículos")}${f("dlII", "Limite art. 75, II (R$)", "Compras e outros serviços")}</div>
    ${f("art6xxii", "Valor do art. 6º, XXII — grande vulto (R$)", "Base da alçada do Dirigente (1%) e do teto de P&D sem PG (0,5%)")}
    <div class="two">${f("ufesp", "UFESP (R$)", "100 UFESPs: exceção de conta fora do BB")}${f("pd300", "Valor do art. 70, III — P&D (R$)", "Dispensa de habilitação em produto para pesquisa")}</div>
    <div class="err" id="pm-err" hidden></div>
    <div class="row"><button type="button" class="btn" data-act="fechar">${S.canWrite ? "Cancelar" : "Fechar"}</button>${S.canWrite ? `<button type="submit" class="btn pri">Salvar parâmetros</button>` : ""}</div>
   </div></form>`);
  document.getElementById("f-par").addEventListener("submit", ev => {
    ev.preventDefault();
    const num = id => parseBR(document.getElementById("pm-" + id).value);
    const o = { ano: parseInt(document.getElementById("pm-ano").value, 10), dlI: num("dlI"), dlII: num("dlII"), art6xxii: num("art6xxii"), ufesp: num("ufesp"), pd300: num("pd300") };
    if (Object.values(o).some(v => !isFinite(v) || v <= 0)) { const e = document.getElementById("pm-err"); e.textContent = "Preencha todos os campos com valores positivos (use vírgula para centavos)."; e.hidden = false; return; }
    saveParams(o); closeModal(); toast("Parâmetros salvos."); scheduleRender();
  });
}
function parseBR(s) { s = String(s || "").replace(/[^\d,.-]/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); return parseFloat(s); }

/* ---------- Eventos ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  const p = S.cur ? S.procs.get(S.cur) : null;
  if (act === "fechar-ov") { if (ev.target === t) closeModal(); return; }
  if (act === "fechar") return closeModal();
  if (act === "novo") { if (!S.canWrite) return toast("Você está em modo somente leitura."); return modalNovo(t.dataset.mod || "pregao"); }
  if (act === "params") return modalParams();
  if (act === "exportar") {
    const dados = { app: "conferencia-processos-svlmat", versao: 1, exportadoEm: new Date().toISOString(), params: S.paramsSalvos ? S.params : null, procs: Object.fromEntries(S.procs) };
    baixarArquivo(`backup-conferencia-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(dados, null, 2), "application/json");
    return toast("Backup baixado. Guarde o arquivo em local seguro.");
  }
  if (act === "importar") return document.getElementById("imp-file").click();
  if (act === "abrir") { location.hash = "p-" + t.dataset.id; return; }
  if (!p) return;
  if (act === "editar") return modalNovo(null, p);
  if (act === "filtro") { S.filtro = t.dataset.f; return render(); }
  if (act === "expandir") { if (S.open.size) S.open.clear(); else analise(p).ids.forEach(id => S.open.add(id)); return render(); }
  if (act === "det") { const id = t.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if (act === "st") {
    const id = t.dataset.id, s = t.dataset.s, cur = p.checks?.[id]?.s;
    const novo = cur === s ? "" : s;
    const patch = { checks: { [id]: { s: novo, em: Date.now() } } };
    if (S.uid) patch.checks[id].por = S.uid;
    updateProc(p.id, patch);
    if (novo === "pend") S.open.add(id);
    return scheduleRender();
  }
  if (act === "q") { updateProc(p.id, { ctx: { [t.dataset.k]: t.dataset.v === "1" } }); return scheduleRender(); }
  if (act === "copiar") { const e = ETAPAS[t.dataset.id]; return copiar(e.mod || ""); }
  if (act === "copiarrel") return copiar(relatorio(p, true));
  if (act === "relatorio") {
    const txt = relatorio(p, false);
    const nome = `conferencia-${(p.sei || "processo").replace(/[^\w.-]+/g, "_")}.txt`;
    baixarArquivo(nome, txt); return;
  }
  if (act === "excluir") { S.confirmDel = true; return render(); }
  if (act === "excluir-nao") { S.confirmDel = false; return render(); }
  if (act === "excluir-sim") { deleteProc(p.id); S.confirmDel = false; location.hash = ""; toast("Processo excluído."); return; }
});

document.addEventListener("change", ev => {
  const el = ev.target; const p = S.cur ? S.procs.get(S.cur) : null;
  if (el.id === "fmod") { S.fmod = el.value; return render(); }
  if (!p || !S.canWrite) return;
  if (el.dataset.q) { updateProc(p.id, { ctx: { [el.dataset.q]: el.value } }); return scheduleRender(); }
  if (el.id === "q-valor") { const v = parseBR(el.value); updateProc(p.id, { ctx: { valor: isFinite(v) ? v : 0 } }); return scheduleRender(); }
  if (el.dataset.dt) { updateProc(p.id, { datas: { [el.dataset.dt]: el.value } }); return scheduleRender(); }
  if (el.dataset.f && el.dataset.id) {
    const cur = p.checks?.[el.dataset.id]?.[el.dataset.f] || "";
    if (cur !== el.value.trim()) updateProc(p.id, { checks: { [el.dataset.id]: { [el.dataset.f]: el.value.trim() } } });
    return scheduleRender();
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "busca") { S.busca = ev.target.value; const pos = ev.target.selectionStart; renderHome(); const b = document.getElementById("busca"); if (b) { b.focus(); b.setSelectionRange(pos, pos); } }
});
document.getElementById("imp-file").addEventListener("change", async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || o.app !== "conferencia-processos-svlmat" || typeof o.procs !== "object") throw new Error("formato");
    let novos = 0, atual = 0;
    for (const [id, p] of Object.entries(o.procs)) {
      const ex = S.procs.get(id);
      if (!ex || (p.atualizadoEm || 0) > (ex.atualizadoEm || 0)) { S.procs.set(id, { ...p, id }); ex ? atual++ : novos++; }
    }
    if (o.params && !S.paramsSalvos) { S.params = { ...PARAM_DEFAULT, ...o.params }; S.paramsSalvos = true; }
    saveLocal(); render();
    toast(`Backup importado: ${novos} processo(s) novo(s), ${atual} atualizado(s).`);
  } catch (e) { toast("Arquivo inválido: escolha um backup gerado por este sistema."); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $modal.innerHTML) closeModal(); });

boot();
})();

</script>
